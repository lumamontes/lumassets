name = "lumassets"
main = "src/worker.ts"
compatibility_date = "2026-11-22"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*", "/wall/post/*", "/wall/image/*", "/wall/entry-template", "/wall/entry-template/*"]

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[[d1_databases]]
binding = "DB"
database_name = "lumassets-wall"
database_id = "9c4b3082-19e4-4b17-bd96-5867861133e9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WALL"
bucket_name = "lumassets-wall"

# Secrets (not here): ADMIN_TOKEN, TURNSTILE_SECRET. See docs/wall.md.
