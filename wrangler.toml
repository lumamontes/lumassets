# Cloudflare Pages settings. The site is static (dist/); functions/api/ is the wall (docs/wall.md).
name = "lumassets"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "lumassets-wall"
database_id = "9c4b3082-19e4-4b17-bd96-5867861133e9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WALL"
bucket_name = "lumassets-wall"

# Secrets (not here): ADMIN_TOKEN, TURNSTILE_SECRET. See docs/wall.md.

# Preview deployments have no wall bindings.
[env.preview]
vars = { DEPLOY = "preview" }
