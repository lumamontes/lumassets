name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # CI only reads the code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://lumassets.bibliotecadezines.workers.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities in dependencies
        run: pnpm audit --prod --audit-level high

      - name: Catalog
        run: pnpm check:catalog

      - name: Unit tests
        run: pnpm test

      - name: Types
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Broken links
        run: pnpm check:links

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
